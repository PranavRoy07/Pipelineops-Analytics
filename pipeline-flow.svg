<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="920" height="220" role="img" aria-label="Animated PipelineOps data flow" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B192C"/><stop offset="1" stop-color="#111C3A"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16A34A"/><stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F97316"/><stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="920" height="220" rx="18" fill="url(#bg)"/>
  <g fill="#1E2A4A" opacity="0.6">
    <circle cx="60" cy="30" r="1.5"/><circle cx="220" cy="190" r="1.5"/><circle cx="480" cy="25" r="1.5"/>
    <circle cx="700" cy="195" r="1.5"/><circle cx="860" cy="35" r="1.5"/><circle cx="360" cy="200" r="1.5"/>
  </g>
  <text x="460" y="36" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#93C5FD">LIVE API  →  BRONZE  →  SILVER  →  GATES  →  INSIGHT  →  DASHBOARD</text>

  <!-- connector lines -->
  <g stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 7" fill="none">
    <path d="M148 110 H178"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M288 110 H318"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M428 110 H458"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M568 110 H598"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M708 110 H738"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1s" repeatCount="indefinite"/></path>
  </g>

  <!-- nodes -->
  <g font-family="sans-serif" text-anchor="middle">
    <g>
      <rect x="38" y="78" width="110" height="64" rx="14" fill="url(#blue)"/>
      <rect x="38" y="78" width="110" height="64" rx="14" fill="none" stroke="#93C5FD" stroke-width="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="0s" repeatCount="indefinite"/></rect>
      <text x="93" y="106" font-size="22">🌐</text><text x="93" y="128" font-size="13" font-weight="700" fill="#fff">Ingest</text>
    </g>
    <g>
      <rect x="178" y="78" width="110" height="64" rx="14" fill="url(#blue)"/>
      <rect x="178" y="78" width="110" height="64" rx="14" fill="none" stroke="#93C5FD" stroke-width="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="0.5s" repeatCount="indefinite"/></rect>
      <text x="233" y="106" font-size="22">🥉</text><text x="233" y="128" font-size="13" font-weight="700" fill="#fff">Bronze</text>
    </g>
    <g>
      <rect x="318" y="78" width="110" height="64" rx="14" fill="url(#blue)"/>
      <rect x="318" y="78" width="110" height="64" rx="14" fill="none" stroke="#93C5FD" stroke-width="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="1s" repeatCount="indefinite"/></rect>
      <text x="373" y="106" font-size="22">⚙️</text><text x="373" y="128" font-size="13" font-weight="700" fill="#fff">Transform</text>
    </g>
    <g>
      <rect x="458" y="78" width="110" height="64" rx="14" fill="url(#green)"/>
      <rect x="458" y="78" width="110" height="64" rx="14" fill="none" stroke="#BBF7D0" stroke-width="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="1.5s" repeatCount="indefinite"/></rect>
      <text x="513" y="106" font-size="22">✅</text><text x="513" y="128" font-size="13" font-weight="700" fill="#fff">9/9 Gates</text>
    </g>
    <g>
      <rect x="598" y="78" width="110" height="64" rx="14" fill="url(#blue)"/>
      <rect x="598" y="78" width="110" height="64" rx="14" fill="none" stroke="#93C5FD" stroke-width="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="2s" repeatCount="indefinite"/></rect>
      <text x="653" y="106" font-size="22">📈</text><text x="653" y="128" font-size="13" font-weight="700" fill="#fff">Analyse</text>
    </g>
    <g>
      <rect x="738" y="78" width="110" height="64" rx="14" fill="url(#orange)"/>
      <rect x="738" y="78" width="110" height="64" rx="14" fill="none" stroke="#FED7AA" stroke-width="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="2.5s" repeatCount="indefinite"/></rect>
      <text x="793" y="106" font-size="22">📊</text><text x="793" y="128" font-size="13" font-weight="700" fill="#fff">Dashboards</text>
    </g>
  </g>

  <!-- travelling data packets -->
  <g filter="url(#glow)">
    <circle r="6" fill="#FBBF24"><animateMotion dur="6s" repeatCount="indefinite" path="M38 160 H848"/></circle>
    <circle r="6" fill="#22D3EE"><animateMotion dur="6s" begin="2s" repeatCount="indefinite" path="M38 160 H848"/></circle>
    <circle r="6" fill="#F472B6"><animateMotion dur="6s" begin="4s" repeatCount="indefinite" path="M38 160 H848"/></circle>
  </g>
  <line x1="38" y1="160" x2="848" y2="160" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="2 8"/>
  <text x="460" y="198" text-anchor="middle" font-family="monospace" font-size="12" fill="#64748B">raw JSON → clean tables → validated → regression → decision-ready analytics</text>
</svg>
